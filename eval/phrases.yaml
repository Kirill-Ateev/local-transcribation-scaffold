# Eval-набор фраз для оценки качества транскрипции (RU + EN-термины).
#
# Классы: ru (чистый русский), mixed (русский с английскими терминами),
# ids (числа и идентификаторы команд).
#
# Для каждой фразы ожидается аудиозапись в eval/audio/<id>.wav|mp3|m4a
# (моно, желательно 16 kHz). Эталон text должен совпадать с произнесённым
# дословно. Записи готовятся владельцем проекта; отсутствующие файлы
# score.py пропускает с предупреждением.

meta:
  language: ru
  notes: >
    Диктовать естественно, как в реальном использовании: одним темпом,
    без пауз-протяжок. Для класса mixed термины произносить по-английски.

phrases:
  # --- чистый русский ---
  - {id: ru_01, class: ru, text: "Открой окно, здесь душно."}
  - {id: ru_02, class: ru, text: "Напомни мне позвонить маме вечером."}
  - {id: ru_03, class: ru, text: "Какая сегодня погода за окном?"}
  - {id: ru_04, class: ru, text: "Запиши: молоко, хлеб и яйца."}
  - {id: ru_05, class: ru, text: "Эта встреча точно переносится на завтра."}
  - {id: ru_06, class: ru, text: "Я думаю, что мы приняли правильное решение."}
  - {id: ru_07, class: ru, text: "Положи телефон на место, пожалуйста."}
  - {id: ru_08, class: ru, text: "Вчера мы долго гуляли по набережной."}
  - {id: ru_09, class: ru, text: "Не забудь выключить свет на кухне."}
  - {id: ru_10, class: ru, text: "Сколько времени осталось до конца рабочего дня?"}

  # --- русский с английскими терминами ---
  - {id: mx_01, class: mixed, text: "Открой деплой в Cursor и проверь логи."}
  - {id: mx_02, class: mixed, text: "Запусти kubectl rollout undo на проде."}
  - {id: mx_03, class: mixed, text: "Добавь в README раздел про Docker Compose."}
  - {id: mx_04, class: mixed, text: "Сделай git push в ветку feature login."}
  - {id: mx_05, class: mixed, text: "Проверь, что API отдаёт JSON со статусом двести."}
  - {id: mx_06, class: mixed, text: "Прогони pytest перед коммитом, пожалуйста."}
  - {id: mx_07, class: mixed, text: "Этот баг воспроизводится только на staging."}
  - {id: mx_08, class: mixed, text: "Настрой webhook для событий из GitHub."}
  - {id: mx_09, class: mixed, text: "Обнови зависимости через npm install."}
  - {id: mx_10, class: mixed, text: "Посмотри метрики latency в Grafana дашборде."}

  # --- числа и идентификаторы ---
  - {id: id_01, class: ids, text: "Выдели мне 128 гигабайт памяти."}
  - {id: id_02, class: ids, text: "Версия 2 точка 14 вышла в марте."}
  - {id: id_03, class: ids, text: "Задача номер 4096 закрыта вчера."}
  - {id: id_04, class: ids, text: "Порт восемь тысяч триста тридцать семь занят."}
  - {id: id_05, class: ids, text: "Коммит abc123f сломал сборку."}
  - {id: id_06, class: ids, text: "IP адрес 192.168.1.10 недоступен."}
  - {id: id_07, class: ids, text: "Таймаут ровно 30 секунд, не больше."}
  - {id: id_08, class: ids, text: "Файл занимает 512 мегабайт на диске."}
  - {id: id_09, class: ids, text: "Ошибка 503 повторяется каждые 5 минут."}
  - {id: id_10, class: ids, text: "Билд номер 2026 собран успешно."}

long_audio:
  notes: >
    Контрольная длинная запись (60+ минут, например вебинар или встреча)
    кладётся в eval/audio/long_control.mp3 и прогоняется вручную одним
    запросом; результат сохраняется рядом для сверки склеек сегментов.
  file: eval/audio/long_control.mp3
