services:
  transcribe:
    build:
      context: ../external/faster-whisper-dgx-spark
      dockerfile: docker/Dockerfile
    image: faster-whisper-spark:local
    restart: always
    # ВАЖНО: Добавлен runtime: nvidia и NVIDIA_VISIBLE_DEVICES
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all  # Доступ ко всем GPU
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility  # Минимум для вычислений
      HOST: 0.0.0.0
      PORT: "8337"
      WHISPER_MODEL: SoybeanMilk/faster-whisper-Breeze-ASR-25
      DEVICE: cuda
      COMPUTE_TYPE: float16
      HF_HOME: /data/hf
    env_file:
      - ../server/.env
    volumes:
      - ../server:/srv/app:ro
      - hf-cache:/data/hf
    ports:
      - "8337:8337"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]