services:
  transcribe:
    build:
      context: ../external/faster-whisper-dgx-spark
      dockerfile: docker/Dockerfile
    image: faster-whisper-spark:local
    restart: always
    runtime: nvidia
    command: >
      python3 -m uvicorn app.main:app
      --app-dir /srv/app
      --host 0.0.0.0 --port 8337
    environment:
      HOST: '0.0.0.0'
      PORT: '8337'
      WHISPER_MODEL: 'SoybeanMilk/faster-whisper-Breeze-ASR-25'
      DEVICE: 'cuda'
      COMPUTE_TYPE: 'float16'
      HF_HOME: '/data/hf'
      NVIDIA_VISIBLE_DEVICES: 'all'
      NVIDIA_DRIVER_CAPABILITIES: 'compute,utility'
    env_file:
      - ../server/.env
    volumes:
      - ../server:/srv/app:ro
      - hf-cache:/data/hf
    ports:
      - '8337:8337'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
