# Целевой запуск на DGX Spark: рантайм из рецепта paruparu/faster-whisper-dgx-spark,
# внутри контейнера работает наш FastAPI-сервис (OpenAI-совместимый API + токен).
#
# Предварительно: клонировать рецепт в external/ в корне репозитория
# (пути в этом файле отсчитываются от каталога deploy/):
#   git clone https://github.com/paruparu/faster-whisper-dgx-spark external/faster-whisper-dgx-spark
#
# Требования рецепта: NVIDIA Container Toolkit, драйвер NVIDIA; CUDA 13 хоста трогать не нужно.
# Запуск:
#   docker compose -f deploy/docker-compose.spark.yml build
#   docker compose -f deploy/docker-compose.spark.yml run --rm download-model   # веса ~3.1 ГБ
#   TRANSCRIBE_TOKEN=$(openssl rand -hex 32) docker compose -f deploy/docker-compose.spark.yml up -d

services:
  transcribe:
    build:
      # Dockerfile рецепта: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04,
      # CTranslate2 v4.6.2 собирается из исходников с CUDA, pip-CPU версия подменяется.
      # ВАЖНО: Dockerfile лежит в подкаталоге docker/ репо рецепта, не в корне.
      context: ../external/faster-whisper-dgx-spark
      dockerfile: docker/Dockerfile
    image: faster-whisper-spark:local
    restart: always
    # Наш сервис вместо штатного server.py рецепта (тот оставлен для спайк-смоука).
    # ENTRYPOINT рецепта (entrypoint.sh) остаётся: он настраивает LD_LIBRARY_PATH
    # для cublas/cudnn, command уходит в него аргументами.
    command: >
      python3 -m uvicorn app.main:app
      --app-dir /srv/app
      --host 0.0.0.0 --port 8337
    environment:
      # Внутри контейнера слушаем все интерфейсы; наружу — только порт ниже
      HOST: 0.0.0.0
      PORT: "8337"
      # Единственная резидентная модель (приоритет compose выше server/.env —
      # для смены модели правьте здесь)
      WHISPER_MODEL: SoybeanMilk/faster-whisper-Breeze-ASR-25
      DEVICE: cuda                  # цель спайка: убедиться, что не cpu
      COMPUTE_TYPE: float16         # рекомендация рецепта для GPU; веса уже fp16
      # Общий кэш весов HuggingFace на томе hf-cache
      HF_HOME: /data/hf
    env_file:
      # TRANSCRIBE_TOKEN, MAX_UPLOAD_MB, DEFAULT_LANGUAGE, INITIAL_PROMPT — отсюда;
      # значения из environment выше имеют приоритет над одноимёнными из файла
      - ../server/.env
    volumes:
      # Код нашего сервиса монтируется внутрь образа рецепта: /srv/app/app/main.py
      - ../server:/srv/app:ro
      # Кэш весов HuggingFace переживает пересоздание контейнера (~3.1 ГБ Breeze fp16)
      - hf-cache:/data/hf
    ports:
      # Наружу — только в LAN; проброс портов на роутере не настраивать
      - "8337:8337"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Однократная предзагрузка весов в volume hf-cache (без GPU и без старта сервиса):
  #   docker compose -f deploy/docker-compose.spark.yml run --rm download-model
  download-model:
    build:
      context: ../external/faster-whisper-dgx-spark
      dockerfile: docker/Dockerfile
    image: faster-whisper-spark:local
    profiles: ["download"]
    init: true
    command: python3 /srv/app/scripts/download_model.py
    environment:
      HF_HOME: /data/hf
      # Если huggingface.co недоступен, можно направить на зеркало:
      # HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ../server:/srv/app:ro
      - hf-cache:/data/hf

volumes:
  hf-cache:
